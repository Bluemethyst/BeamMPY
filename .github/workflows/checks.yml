name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      real_beammp:
        description: Download official BeamMP and run disposable private smoke tests
        type: boolean
        default: false
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest
      - if: github.event_name == 'workflow_dispatch' && inputs.real_beammp
        run: python tools/run_real_smoke.py
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - run: python -m build
      - run: python tools/verify_distribution.py dist/beammpy-0.3.2-py3-none-any.whl
      - run: python tools/package_installers.py
      - run: python tools/verify_installers.py dist/beammpy-0.3.2-py3-none-any.whl
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*
